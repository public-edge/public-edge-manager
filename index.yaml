apiVersion: v1
entries:
  public-edge-manager:
  - annotations:
      artifacthub.io/category: networking
      artifacthub.io/changes: |
        - kind: fixed
          description: Point the chart at the current public-edge GitHub and GHCR organization.
        - kind: fixed
          description: Fail closed on empty inventory and stale service probe evidence.
        - kind: added
          description: Serve delegated zones and explicitly marked external CDN records.
        - kind: fixed
          description: Restart authority pods when ConfigMap values, including the publisher node, change.
        - kind: changed
          description: Consume NetworkPathAssessment v1alpha2 strictly as a freshness, readiness and reachability eligibility gate; remove O/S/I ranking weights.
        - kind: fixed
          description: Bound concurrent endpoint sampling so probe load cannot starve health and discovery requests.
        - kind: added
          description: Expose probe.maxWorkers for installations with different service counts and CPU budgets.
      artifacthub.io/images: |
        - name: public-edge-manager
          image: ghcr.io/public-edge/public-edge-manager:0.5.3
          platforms:
            - linux/amd64
            - linux/arm64
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: source
          url: https://github.com/public-edge/public-edge-manager
        - name: support
          url: https://github.com/public-edge/public-edge-manager/issues
