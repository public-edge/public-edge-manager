[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "public-edge-manager"
version = "0.6.10"
description = "Region- and capacity-aware public edge health and DNS authority for Kubernetes"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "RE8CH Platform"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
public-edge-manager = "public_edge_manager.authority:main"
edgectl = "public_edge_manager.edgectl:main"

[tool.setuptools.packages.find]
where = ["src"]
