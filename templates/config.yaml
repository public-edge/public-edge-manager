{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ include "public-edge-manager.name" . }}}
data:
  API_GROUP: {{ .Values.api.group | quote }}
  NAMESERVERS: {{ join " " .Values.nameservers | quote }}
  SOA_RNAME: {{ .Values.dns.soaRname | quote }}
  PROBE_USER_AGENT: {{ .Values.probe.userAgent | quote }}
  PUBLICATION_ENABLED: {{ .Values.publication.enabled | quote }}
  PUBLICATION_REFS_JSON: {{ .Values.publication.refs | toJson | quote }}
  PUBLICATION_ADAPTERS_JSON: {{ .Values.publication.adapters | toJson | quote }}
  READINESS_GATES_JSON: {{ .Values.readinessGates | toJson | quote }}
  CANDIDATE_CAPACITY_WEIGHT: {{ .Values.candidateSelection.capacityWeight | quote }}
  CANDIDATE_LOCAL_AREA_BONUS: {{ .Values.candidateSelection.localAreaBonus | quote }}
  CANDIDATE_PRIORITY_WEIGHT: {{ .Values.candidateSelection.priorityWeight | quote }}
  CANDIDATE_LATENCY_DIVISOR_MS: {{ .Values.candidateSelection.latencyDivisorMs | quote }}
  CANDIDATE_LATENCY_PENALTY_CAP: {{ .Values.candidateSelection.latencyPenaltyCap | quote }}
  CANDIDATE_LOCAL_NODE_BONUS: {{ .Values.candidateSelection.localNodeBonus | quote }}
  CANDIDATE_FAILOVER_GRACE_SECONDS: {{ .Values.candidateSelection.failoverGraceSeconds | quote }}
  CANDIDATE_MIN_READY_SECONDS: {{ .Values.candidateSelection.minReadySeconds | quote }}
  CANDIDATE_MIN_HOLD_SECONDS: {{ .Values.candidateSelection.minHoldSeconds | quote }}
  CLIENT_AREA_CIDRS_JSON: {{ .Values.candidateSelection.resolverCidrs | toJson | quote }}
  FABRIC_EVIDENCE_MODE: {{ .Values.fabricEvidence.mode | quote }}
  FABRIC_EVIDENCE_API_GROUP: {{ .Values.fabricEvidence.apiGroup | quote }}
  FABRIC_EVIDENCE_API_VERSION: {{ .Values.fabricEvidence.apiVersion | quote }}
  FABRIC_EVIDENCE_RESOURCE: {{ .Values.fabricEvidence.resource | quote }}
  FABRIC_EVIDENCE_ALLOWED_STATES_JSON: {{ .Values.fabricEvidence.allowedStates | toJson | quote }}
  FABRIC_REQUIRE_NODE_READY: {{ .Values.fabricEvidence.requireNodeReady | quote }}
{{- end }}
