{{- if .Values.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: {{ include "public-edge-manager.name" . }}}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "public-edge-manager.name" . }}}}
  updateStrategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: {{ .Values.workload.maxUnavailable }}}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "public-edge-manager.name" . }}}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "public-edge-manager.name" . }}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      hostNetwork: {{ .Values.workload.hostNetwork }}
      dnsPolicy: {{ ternary "ClusterFirstWithHostNet" "ClusterFirst" .Values.workload.hostNetwork }}
      {{- with .Values.workload.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.discovery.authorityLabel }}
                    operator: In
                    values: ["true"]
      {{- with .Values.workload.tolerations }}
      tolerations: {{ . | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "public-edge-manager.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom: [{configMapRef: {name: {{ include "public-edge-manager.name" . }}}}]
          env:
            - {name: RECORDS_FILE, value: /etc/public-edge-records/records.json}
            - {name: RUNTIME_FILE, value: /etc/public-edge-runtime/runtime.json}
            {{- if .Values.dns.nameserversConfigMap }}
            - {name: NAMESERVERS_FILE, value: /etc/public-edge-nameservers/nameservers.json}
            {{- end }}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: KUBERNETES_API_FALLBACK_URLS_JSON, value: {{ .Values.workload.kubernetesApiFallbackUrls | toJson | quote }}}
            - {name: HTTP_PORT, value: {{ .Values.workload.httpPort | quote }}}
            - {name: DNS_PORT, value: {{ .Values.workload.dnsPort | quote }}}
            - {name: PROBE_CONNECT_TIMEOUT_SECONDS, value: {{ .Values.probe.connectTimeoutSeconds | quote }}}
            - {name: PROBE_RESPONSE_TIMEOUT_SECONDS, value: {{ .Values.probe.responseTimeoutSeconds | quote }}}
            - {name: PROBE_INTERVAL_SECONDS, value: {{ .Values.probe.intervalSeconds | quote }}}
            - {name: PROBE_MAX_WORKERS, value: {{ .Values.probe.maxWorkers | quote }}}
          volumeMounts:
            - {name: records, mountPath: /etc/public-edge-records, readOnly: true}
            - {name: runtime, mountPath: /etc/public-edge-runtime, readOnly: true}
            {{- if .Values.dns.transfer.xot.tlsSecretRef }}
            - {name: xot-tls, mountPath: /etc/public-edge-xot, readOnly: true}
            {{- end }}
            {{- if .Values.routeSnapshot.publicKeyRef }}
            - {name: snapshot-public-key, mountPath: /etc/public-edge-snapshot-public, readOnly: true}
            {{- end }}
            {{- if .Values.routeSnapshot.signingKeySecretRef }}
            - {name: snapshot-signing-key, mountPath: /etc/public-edge-snapshot-signing, readOnly: true}
            {{- end }}
            {{- if .Values.routeSnapshot.tlsSecretRef }}
            - {name: snapshot-tls, mountPath: /etc/public-edge-snapshot-tls, readOnly: true}
            {{- end }}
            {{- if .Values.dns.nameserversConfigMap }}
            - {name: nameservers, mountPath: /etc/public-edge-nameservers, readOnly: true}
            {{- end }}
          # Check the process's own marker; host-network HTTP may be intercepted on a node.
          readinessProbe: {exec: {command: ["test", "-f", "/dev/shm/public-edge-dns-ready"]}, periodSeconds: 5}
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          securityContext: {{ .Values.workload.containerSecurityContext | toYaml | nindent 12 }}
      volumes:
        - name: records
          configMap: {name: {{ include "public-edge-manager.name" . }}-records}
        - name: runtime
          configMap: {name: {{ .Values.runtime.configMapName }} }
        {{- if .Values.dns.transfer.xot.tlsSecretRef }}
        - name: xot-tls
          secret: {secretName: {{ .Values.dns.transfer.xot.tlsSecretRef }}}
        {{- end }}
        {{- if .Values.routeSnapshot.publicKeyRef }}
        - name: snapshot-public-key
          configMap: {name: {{ .Values.routeSnapshot.publicKeyRef }}}
        {{- end }}
        {{- if .Values.routeSnapshot.signingKeySecretRef }}
        - name: snapshot-signing-key
          secret: {secretName: {{ .Values.routeSnapshot.signingKeySecretRef }}}
        {{- end }}
        {{- if .Values.routeSnapshot.tlsSecretRef }}
        - name: snapshot-tls
          secret: {secretName: {{ .Values.routeSnapshot.tlsSecretRef }}}
        {{- end }}
        {{- if .Values.dns.nameserversConfigMap }}
        - name: nameservers
          configMap: {name: {{ .Values.dns.nameserversConfigMap }}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "public-edge-manager.name" . }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ include "public-edge-manager.name" . }}}
  ports:
    - {name: http, port: 8080, targetPort: {{ .Values.workload.httpPort }}, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "public-edge-manager.name" . }}-dns
  {{- with .Values.service.annotations }}
  annotations: {{ . | toYaml | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector: {app.kubernetes.io/name: {{ include "public-edge-manager.name" . }}}
  ports:
    - {name: dns-udp, port: 53, targetPort: {{ .Values.workload.dnsPort }}, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: {{ .Values.workload.dnsPort }}, protocol: TCP}
    {{- if ne .Values.dns.transfer.role "disabled" }}
    - {name: xot, port: 853, targetPort: 853, protocol: TCP}
    {{- end }}
    {{- if eq .Values.dns.transfer.role "primary" }}
    - {name: snapshot, port: 8443, targetPort: 8443, protocol: TCP}
    {{- end }}
{{- end }}
