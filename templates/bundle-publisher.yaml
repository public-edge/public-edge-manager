{{- if and .Values.enabled .Values.bundlePublisher.enabled }}
{{- if or (not .Values.bundlePublisher.nodeName) (not .Values.bundlePublisher.bindAddress) (not .Values.bundlePublisher.hmacSecretName) }}
{{- fail "bundlePublisher requires nodeName, bindAddress, and hmacSecretName" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "public-edge-manager.name" . }}-bundle-publisher}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "public-edge-manager.name" . }}-bundle-publisher}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "public-edge-manager.name" . }}-bundle-publisher}
    spec:
      serviceAccountName: {{ include "public-edge-manager.name" . }}
      securityContext: {fsGroup: 65532}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.bundlePublisher.nodeName | quote }}
      containers:
        - name: publisher
          image: {{ include "public-edge-manager.image" . }}
          command: [python, -m, public_edge_manager.bundle_publisher]
          envFrom: [{configMapRef: {name: {{ include "public-edge-manager.name" . }}}}]
          env:
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: RECORDS_CONFIGMAP, value: {{ printf "%s-records" (include "public-edge-manager.name" .) | quote }}}
            - {name: RUNTIME_CONFIGMAP, value: {{ .Values.runtime.configMapName | quote }}}
            - {name: NAMESERVER_CONFIGMAP, value: {{ .Values.dns.nameserversConfigMap | quote }}}
            - {name: BUNDLE_PORT, value: {{ .Values.bundlePublisher.port | quote }}}
            - {name: BUNDLE_BIND_ADDRESS, value: {{ .Values.bundlePublisher.bindAddress | quote }}}
          ports: [{name: bundle, containerPort: {{ .Values.bundlePublisher.port }}, protocol: TCP}]
          volumeMounts: [{name: bundle-key, mountPath: /run/bundle-key, readOnly: true}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          resources: {{ .Values.resources | toYaml | nindent 12 }}
      volumes:
        - name: bundle-key
          secret: {secretName: {{ .Values.bundlePublisher.hmacSecretName }}, defaultMode: 0440}
{{- end }}
