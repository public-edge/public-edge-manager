{{- if and .Values.enabled .Values.federation.sourceServices }}
{{- if not .Values.discovery.enabled }}
{{- fail "federation.sourceServices requires the local discovery controller" }}
{{- end }}
{{- $_ := required "federation.sourceServices requires federation.clusterRef" .Values.federation.clusterRef }}
{{- $namespaces := dict }}
{{- $services := dict }}
{{- range .Values.federation.sourceServices }}
{{- $identity := printf "%s/%s" .namespace .name }}
{{- if hasKey $services $identity }}{{ fail "duplicate local Service publication binding" }}{{ end }}
{{- $_ := set $services $identity true }}
{{- $ids := dict }}
{{- range .bindings }}
{{- if hasKey $ids .id }}{{ fail "duplicate local ingress binding ID" }}{{ end }}
{{- $_ := set $ids .id true }}
{{- end }}
{{- $_ := set $namespaces .namespace (append (get $namespaces .namespace | default list) .name) }}
{{- end }}
{{- range $namespace, $names := $namespaces }}
{{- $role := printf "%s-ingress-%s" (include "public-edge-manager.name" $ | trunc 40) ($namespace | sha256sum | trunc 12) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ $role }}, namespace: {{ $namespace }}}
rules:
  - apiGroups: [""]
    resources: [services]
    resourceNames: {{ $names | uniq | sortAlpha | toJson }}
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ $role }}, namespace: {{ $namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $role }}}
subjects:
  - {kind: ServiceAccount, name: {{ include "public-edge-manager.name" $ }}, namespace: {{ $.Release.Namespace }}}
{{- end }}
{{- end }}
