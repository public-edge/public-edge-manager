{{- if and .Values.enabled .Values.discovery.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "public-edge-manager.name" . }}-controller}
spec:
  replicas: {{ .Values.discovery.replicas }}
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "public-edge-manager.name" . }}-controller}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "public-edge-manager.name" . }}-controller}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "public-edge-manager.name" . }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: {{ include "public-edge-manager.name" . }}-controller}
      containers:
        - name: controller
          image: {{ include "public-edge-manager.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, public_edge_manager.controller]
          envFrom: [{configMapRef: {name: {{ include "public-edge-manager.name" . }}}}]
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: DISCOVERY_INTERVAL_SECONDS, value: {{ .Values.discovery.intervalSeconds | quote }}}
            - {name: DISCOVERY_PROBE_TIMEOUT_SECONDS, value: {{ .Values.discovery.probeTimeoutSeconds | quote }}}
            - {name: DEFAULT_CAPACITY_MBPS, value: {{ .Values.discovery.defaultCapacityMbps | quote }}}
            - {name: MINIMUM_CAPACITY_MBPS, value: {{ .Values.discovery.minimumCapacityMbps | quote }}}
            - {name: MAX_NAMESERVERS, value: {{ .Values.discovery.maxNameservers | quote }}}
            - {name: GATEWAY_NAMESPACE, value: {{ .Values.discovery.gatewayNamespace | quote }}}
            - {name: GATEWAY_SELECTOR, value: {{ .Values.discovery.gatewaySelector | quote }}}
            - {name: AUTHORITY_LABEL, value: {{ .Values.discovery.authorityLabel | quote }}}
            - {name: INGRESS_LABEL, value: {{ .Values.discovery.ingressLabel | quote }}}
            - {name: SERVICE_CLASSES, value: {{ join "," .Values.discovery.serviceClasses | quote }}}
            - {name: PARENT_ZONE, value: {{ .Values.discovery.parentZone | quote }}}
            - {name: CHILD_ZONES_JSON, value: {{ .Values.discovery.childZones | toJson | quote }}}
            - {name: NAMESERVER_CONFIGMAP, value: {{ .Values.dns.nameserversConfigMap | quote }}}
            {{- with .Values.discovery.cloudflareSecretRef }}
            - {name: CF_SECRET_NAMESPACE, value: {{ .namespace | quote }}}
            - {name: CF_SECRET_NAME, value: {{ .name | quote }}}
            - {name: CF_SECRET_KEY, value: {{ default "CF_API_TOKEN" .key | quote }}}
            {{- end }}
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
{{- end }}
