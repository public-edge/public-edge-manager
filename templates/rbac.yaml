{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ include "public-edge-manager.name" . }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ include "public-edge-manager.name" . }}}
rules:
  - apiGroups: [{{ .Values.api.group | quote }}]
    resources: [publicedges]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [{{ .Values.api.group | quote }}]
    resources: [publicedges/status]
    verbs: [get, patch, update]
  {{- if ne .Values.fabricEvidence.mode "Disabled" }}
  - apiGroups: [{{ .Values.fabricEvidence.apiGroup | quote }}]
    resources: [{{ .Values.fabricEvidence.resource | quote }}]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch, update]
  {{- end }}
  {{- with .Values.discovery.capacityInventory }}
  - apiGroups: [{{ .apiGroup | quote }}]
    resources: [{{ .resource | quote }}]
    verbs: [get, list, watch]
  {{- end }}
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes, tlsroutes]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [""]
    resources: [services, endpoints]
    verbs: [get, list, watch]
  {{- if .Values.readinessGates }}
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  {{- end }}
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch{{- if .Values.rbac.mutateIngresses }}, patch, update{{- end }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ include "public-edge-manager.name" . }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "public-edge-manager.name" . }}}
subjects:
  - {kind: ServiceAccount, name: {{ include "public-edge-manager.name" . }}, namespace: {{ .Release.Namespace }}}
{{- end }}
{{- if and .Values.enabled .Values.discovery.cloudflareSecretRef }}
{{- with .Values.discovery.cloudflareSecretRef }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ include "public-edge-manager.name" $ }}-cloudflare, namespace: {{ .namespace }} }
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .name }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ include "public-edge-manager.name" $ }}-cloudflare, namespace: {{ .namespace }} }
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "public-edge-manager.name" $ }}-cloudflare}
subjects:
  - {kind: ServiceAccount, name: {{ include "public-edge-manager.name" $ }}, namespace: {{ $.Release.Namespace }} }
{{- end }}
{{- end }}
