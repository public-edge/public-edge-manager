name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Verify dependency lock files
        run: |
          uv pip compile --python-version 3.12 --universal --generate-hashes \
            --custom-compile-command 'uv pip compile requirements-runtime.in --python-version 3.12 --universal --generate-hashes --output-file requirements-runtime.lock' \
            requirements-runtime.in --output-file /tmp/requirements-runtime.lock
          uv pip compile --python-version 3.12 --universal --generate-hashes \
            --custom-compile-command 'uv pip compile requirements-test.in --python-version 3.12 --universal --generate-hashes --output-file requirements-test.lock' \
            requirements-test.in --output-file /tmp/requirements-test.lock
          cmp requirements-runtime.lock /tmp/requirements-runtime.lock
          cmp requirements-test.lock /tmp/requirements-test.lock
      - name: Install project and test dependencies
        run: |
          python -m pip install --require-hashes --requirement requirements-test.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Unit tests
        run: |
          python -m compileall -q src tests
          python scripts/validate_artifacts.py
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python -m pytest -q
      - name: Reject private deployment data
        run: |
          if grep -R -n -E '223\.159\.210\.222|10\.181\.22\.|registry\.re8ch\.com' --exclude-dir=.git .; then
            echo 'private deployment data must stay outside public product defaults'
            exit 1
          fi
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Validate Helm chart
        run: |
          helm lint .
          helm lint . -f examples/values-example.yaml
          helm lint . -f tests/transfer-topology-values.yaml
          helm template public-edge-manager . -f tests/transfer-topology-values.yaml >/dev/null
          helm template public-edge-manager . -f examples/values-example.yaml >/dev/null
          rendered=$(helm template public-edge-manager . -f examples/values-example.yaml)
          if printf '%s\n' "$rendered" | grep -q -E 'edge-authority-a|192\.0\.2\.|10\.0\.0\.'; then
            echo 'dynamic mode must not render node inventory or fixed edge addresses'
            exit 1
          fi
          before=$(helm template public-edge-manager . -f examples/values-example.yaml | sed -n 's/^[[:space:]]*checksum\/config: //p' | head -n 1)
          after=$(helm template public-edge-manager . -f examples/values-example.yaml --set candidateSelection.capacityWeight=11 | sed -n 's/^[[:space:]]*checksum\/config: //p' | head -n 1)
          test -n "$before" && test -n "$after" && test "$before" != "$after"
          record_only=$(helm template public-edge-manager . -f examples/values-example.yaml --set 'dns.zones[0]=other.example.' | sed -n 's/^[[:space:]]*checksum\/config: //p' | head -n 1)
          test "$before" = "$record_only"
      - name: Build container
        run: docker build --build-arg VERSION=ci .
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build RouterOS ARM32 authority
        run: |
          docker buildx build --platform linux/arm/v7 -f routeros/Dockerfile . --load -t routeros-authority:ci
          test "$(docker image inspect routeros-authority:ci --format '{{.Architecture}}')" = arm
