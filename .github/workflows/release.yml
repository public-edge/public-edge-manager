name: Release

on:
  push:
    tags: ["v*"]

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate public artifact inventory
        run: |
          python scripts/validate_artifacts.py --release-version "${GITHUB_REF_NAME}"
          mkdir -p dist
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign container image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
      - name: Attest controller image provenance
        id: attest-controller
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish RouterOS ARM32 authority
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: routeros-image
        with:
          context: .
          file: routeros/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/routeros-authority:${{ github.ref_name }}
          provenance: mode=max
      - name: Sign RouterOS authority image
        env:
          DIGEST: ${{ steps.routeros-image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/routeros-authority@${DIGEST}"
      - name: Attest RouterOS image provenance
        id: attest-routeros
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/routeros-authority
          subject-digest: ${{ steps.routeros-image.outputs.digest }}
          push-to-registry: true
      - name: Generate controller SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: dist/controller-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate controller CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          format: cyclonedx-json
          output-file: dist/controller-image.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate RouterOS SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/routeros-authority@${{ steps.routeros-image.outputs.digest }}
          format: spdx-json
          output-file: dist/routeros-authority-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate RouterOS CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/routeros-authority@${{ steps.routeros-image.outputs.digest }}
          format: cyclonedx-json
          output-file: dist/routeros-authority-image.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest image SBOMs
        env:
          CONTROLLER_DIGEST: ${{ steps.image.outputs.digest }}
          ROUTEROS_DIGEST: ${{ steps.routeros-image.outputs.digest }}
        run: |
          cosign attest --yes --type spdxjson --predicate dist/controller-image.spdx.json \
            "ghcr.io/${GITHUB_REPOSITORY}@${CONTROLLER_DIGEST}"
          cosign attest --yes --type cyclonedx --predicate dist/controller-image.cyclonedx.json \
            "ghcr.io/${GITHUB_REPOSITORY}@${CONTROLLER_DIGEST}"
          cosign attest --yes --type spdxjson --predicate dist/routeros-authority-image.spdx.json \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/routeros-authority@${ROUTEROS_DIGEST}"
          cosign attest --yes --type cyclonedx --predicate dist/routeros-authority-image.cyclonedx.json \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/routeros-authority@${ROUTEROS_DIGEST}"
          cp "${{ steps.attest-controller.outputs.bundle-path }}" dist/controller-image.provenance.json
          cp "${{ steps.attest-routeros.outputs.bundle-path }}" dist/routeros-authority-image.provenance.json
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Validate release version
        run: test "v$(helm show chart . | awk '/^version:/ {print $2}')" = "${GITHUB_REF_NAME}"
      - name: Publish Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package . --destination dist
          helm push dist/public-edge-manager-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
      - name: Sign Helm chart
        id: chart
        run: |
          chart=$(find dist -name 'public-edge-manager-*.tgz' -print -quit)
          test -n "$chart"
          cosign sign-blob --yes --bundle "${chart}.bundle.json" "$chart"
          (cd dist && sha256sum "$(basename "$chart")" > "$(basename "$chart").sha256")
          echo "path=${chart}" >> "$GITHUB_OUTPUT"
      - name: Attest Helm chart provenance
        id: attest-chart
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ steps.chart.outputs.path }}
      - name: Record published package identities and evidence
        env:
          CONTROLLER_DIGEST: ${{ steps.image.outputs.digest }}
          ROUTEROS_DIGEST: ${{ steps.routeros-image.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart_digest=$(oras manifest fetch --descriptor \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/public-edge-manager:${version}" | jq -r .digest)
          cp "${{ steps.attest-chart.outputs.bundle-path }}" \
            "dist/public-edge-manager-${version}.tgz.provenance.json"
          digest() { sha256sum "$1" | awk '{print "sha256:" $1}'; }
          jq -n \
            --arg version "$version" \
            --arg source "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}" \
            --arg controller "ghcr.io/${GITHUB_REPOSITORY}@${CONTROLLER_DIGEST}" \
            --arg controller_digest "$CONTROLLER_DIGEST" \
            --arg routeros "ghcr.io/${GITHUB_REPOSITORY_OWNER}/routeros-authority@${ROUTEROS_DIGEST}" \
            --arg routeros_digest "$ROUTEROS_DIGEST" \
            --arg chart "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/public-edge-manager@${chart_digest}" \
            --arg controller_spdx "$(digest dist/controller-image.spdx.json)" \
            --arg controller_cdx "$(digest dist/controller-image.cyclonedx.json)" \
            --arg controller_provenance "$(digest dist/controller-image.provenance.json)" \
            --arg routeros_spdx "$(digest dist/routeros-authority-image.spdx.json)" \
            --arg routeros_cdx "$(digest dist/routeros-authority-image.cyclonedx.json)" \
            --arg routeros_provenance "$(digest dist/routeros-authority-image.provenance.json)" \
            --arg chart_provenance "$(digest "dist/public-edge-manager-${version}.tgz.provenance.json")" \
            --arg chart_signature "$(digest "dist/public-edge-manager-${version}.tgz.bundle.json")" \
            '{schemaVersion:"public-edge.dev/release-manifest/v1", version:$version, source:$source,
              artifacts:[
                {id:"controller-image", reference:$controller, evidence:{
                  signatures:[{type:"cosign-keyless",reference:$controller,digest:$controller_digest}],
                  provenance:[{type:"slsa-github-v1",reference:"controller-image.provenance.json",digest:$controller_provenance}],
                  sboms:[
                    {format:"spdx-json",reference:"controller-image.spdx.json",digest:$controller_spdx},
                    {format:"cyclonedx-json",reference:"controller-image.cyclonedx.json",digest:$controller_cdx}
                  ]}},
                {id:"routeros-authority-image", reference:$routeros, evidence:{
                  signatures:[{type:"cosign-keyless",reference:$routeros,digest:$routeros_digest}],
                  provenance:[{type:"slsa-github-v1",reference:"routeros-authority-image.provenance.json",digest:$routeros_provenance}],
                  sboms:[
                    {format:"spdx-json",reference:"routeros-authority-image.spdx.json",digest:$routeros_spdx},
                    {format:"cyclonedx-json",reference:"routeros-authority-image.cyclonedx.json",digest:$routeros_cdx}
                  ]}},
                {id:"helm-chart", reference:$chart, evidence:{
                  signatures:[{type:"cosign-blob-bundle",reference:("public-edge-manager-"+$version+".tgz.bundle.json"),digest:$chart_signature}],
                  provenance:[{type:"slsa-github-v1",reference:("public-edge-manager-"+$version+".tgz.provenance.json"),digest:$chart_provenance}],
                  sboms:[]}}
              ]}' > dist/release-manifest.json
      - name: Publish Artifact Hub repository metadata
        run: |
          oras push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/public-edge-manager:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - name: Sign and attest release manifest
        id: manifest
        run: |
          cosign sign-blob --yes --bundle dist/release-manifest.json.bundle.json dist/release-manifest.json
          (cd dist && sha256sum release-manifest.json > release-manifest.json.sha256)
      - name: Attest release manifest provenance
        id: attest-manifest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/release-manifest.json
      - name: Verify all release evidence
        env:
          CONTROLLER_DIGEST: ${{ steps.image.outputs.digest }}
          ROUTEROS_DIGEST: ${{ steps.routeros-image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest-manifest.outputs.bundle-path }}" dist/release-manifest.json.provenance.json
          jq -e '.spdxVersion and .packages' dist/*.spdx.json >/dev/null
          jq -e '.bomFormat == "CycloneDX" and .components' dist/*.cyclonedx.json >/dev/null
          identity='^https://github.com/public-edge/public-edge-manager/.github/workflows/release.yml@refs/tags/v'
          issuer='https://token.actions.githubusercontent.com'
          controller="ghcr.io/${GITHUB_REPOSITORY}@${CONTROLLER_DIGEST}"
          routeros="ghcr.io/${GITHUB_REPOSITORY_OWNER}/routeros-authority@${ROUTEROS_DIGEST}"
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$controller"
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$routeros"
          verify_attestation() {
            cosign verify-attestation --type "$2" --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer "$issuer" "$1" >/dev/null
          }
          verify_attestation "$controller" spdxjson
          verify_attestation "$controller" cyclonedx
          verify_attestation "$routeros" spdxjson
          verify_attestation "$routeros" cyclonedx
          chart=$(find dist -name 'public-edge-manager-*.tgz' -print -quit)
          cosign verify-blob --bundle "${chart}.bundle.json" \
            --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$chart"
          cosign verify-blob --bundle dist/release-manifest.json.bundle.json \
            --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" dist/release-manifest.json
          gh attestation verify "oci://${controller}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://${routeros}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$chart" --repo "$GITHUB_REPOSITORY"
          gh attestation verify dist/release-manifest.json --repo "$GITHUB_REPOSITORY"
          python scripts/verify_release_evidence.py dist/release-manifest.json dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
      - name: Build Artifact Hub Helm repository index
        run: |
          mkdir -p pages
          if curl --fail --silent --show-error --location \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/public-edge-manager/index.yaml" \
            --output pages/index.yaml; then
            helm repo index dist \
              --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
              --merge pages/index.yaml
          else
            helm repo index dist \
              --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          fi
          cp dist/index.yaml artifacthub-repo.yml pages/
      - name: Publish Artifact Hub Helm repository
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          keep_files: true
