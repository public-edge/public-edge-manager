name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign container image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
      - uses: azure/setup-helm@v4
      - name: Validate release version
        run: test "v$(helm show chart . | awk '/^version:/ {print $2}')" = "${GITHUB_REF_NAME}"
      - name: Publish Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package . --destination dist
          helm push dist/public-edge-manager-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
      - name: Publish Artifact Hub repository metadata
        run: |
          oras push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/public-edge-manager:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - name: Sign Helm chart
        run: |
          chart=$(find dist -name 'public-edge-manager-*.tgz' -print -quit)
          cosign sign-blob --yes --bundle "${chart}.bundle.json" "${chart}"
          sha256sum "${chart}" > "${chart}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
      - name: Build Artifact Hub Helm repository index
        run: |
          mkdir -p pages
          if curl --fail --silent --show-error --location \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/public-edge-manager/index.yaml" \
            --output pages/index.yaml; then
            helm repo index dist \
              --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
              --merge pages/index.yaml
          else
            helm repo index dist \
              --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          fi
          cp dist/index.yaml artifacthub-repo.yml pages/
      - name: Publish Artifact Hub Helm repository
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          keep_files: true
