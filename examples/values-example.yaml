enabled: true

nameservers: [ns-bootstrap.edge.example.]
dns:
  soaRname: hostmaster.edge.example.
  zones: [edge.example.]
  nameserversConfigMap: public-edge-nameservers

discovery:
  parentZone: example.
  childZones: [edge.example]
  gatewaySelector: example.com/public-edge-gateway=true

services:
  app.example.com.: {service: app, class: web, probePath: /healthz}

fabricEvidence:
  mode: Required
  requireNodeReady: false
