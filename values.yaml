image:
  repository: ghcr.io/public-edge/public-edge-manager
  tag: "0.7.0"
  digest: ""
  pullPolicy: IfNotPresent

# Explicit opt-in prevents an unconfigured release from binding DNS port 53 on
# every cluster node.
enabled: false

crd:
  install: true

api:
  group: networking.re8ch.com

nameservers: []
services: {}
readinessGates: {}

discovery:
  enabled: true
  replicas: 2
  dnsPolicy: ClusterFirst
  dnsNameservers: []
  # Place discovery controllers at independent public vantage points so DNS
  # authority checks exercise the Internet path rather than local hairpin NAT.
  probeNodeNames: []
  tolerations: []
  intervalSeconds: 15
  probeTimeoutSeconds: 2
  # Unknown uplink capacity is not enough to qualify as a public edge.
  defaultCapacityMbps: 1
  # Nodes below this measured/configured uplink are never public exits.
  minimumCapacityMbps: 100
  # Public Edge ingress and DNS Authority exclusions are separate roles.
  excludedNodeNames: []
  excludedAuthorityNodeNames: []
  # Optional shared facts for known nodes. Unlisted Nodes may qualify through
  # observed-capacity-mbps/capacity-mbps annotations and live path evidence.
  clusterInventoryConfigMap: {}
  maxNameservers: 3
  gatewayNamespace: ""
  gatewaySelector: networking.re8ch.com/public-edge-gateway=true
  authorityLabel: networking.re8ch.com/public-edge-authority-ready
  ingressLabel: networking.re8ch.com/public-edge-ready
  serviceClasses: [api, web, registry, db-ro, db-rw]
  parentZone: ""
  childZones: []
  # Delegated apexes whose public A answers must be usable on every NS.
  addressZones: []
  requiredAddressNames: []
  # External secondary authorities retained alongside elected primary NS.
  secondaryNameserversByZone: {}
  # Optional authorities outside Kubernetes, qualified by public UDP/TCP probes.
  externalAuthorities: []
  cloudflareSecretRef: {}

runtime:
  configMapName: public-edge-runtime

workload:
  hostNetwork: true
  # TLS-verified API endpoints used when the in-cluster Service VIP is unreachable.
  kubernetesApiFallbackUrls: []
  dnsPort: 53
  httpPort: 8080
  priorityClassName: ""
  tolerations: []
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities: {add: [NET_BIND_SERVICE], drop: [ALL]}
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532

probe:
  connectTimeoutSeconds: 5
  responseTimeoutSeconds: 12
  intervalSeconds: 3
  # Bounds candidate/service TLS sampling so probes cannot starve health checks.
  maxWorkers: 8
  userAgent: public-edge-manager/0.4

dns:
  soaRname: hostmaster.invalid.
  # TCP AXFR is disabled until both a zone and source CIDRs are configured.
  axfrZones: []
  axfrAllowedCidrs: []
  # Optional ConfigMap with nameservers.json: {"nameservers":["ns1.example."]}.
  # A controller can update this without restarting the authority process.
  nameserversConfigMap: ""
  # Optional delegated zones. When set, apex NS/SOA and RFC-compatible negative
  # answers are served only for names inside these zones.
  zones: []
  # Static records delegated to a third-party CDN; never health-retargeted.
  externalRecords: {}
  transfer:
    role: disabled # disabled | primary | secondary
    xot:
      listenAddress: "0.0.0.0:853"
      serverName: ""
      tlsSecretRef: ""
    # Each secondary has a stable id and an optional certificate DNS SAN.
    secondaries: []

routingPolicy:
  defaultRegion: default
  regions: {}
  # ECS is honored only when the query arrived from one of these resolvers.
  # Empty means ECS is not trusted; resolver source classification still applies.
  trustedEcsPrefixes: []

routeSnapshot:
  endpoint: ""
  publicKeyRef: ""
  signingKeySecretRef: ""
  tlsSecretRef: ""
  statePath: /var/lib/public-edge/route-snapshot.json
  refreshSeconds: 15
  maxStaleSeconds: 900

candidateSelection:
  capacityWeight: 10
  localAreaBonus: 100000
  priorityWeight: 1
  latencyDivisorMs: 20
  latencyPenaltyCap: 50
  localNodeBonus: 5
  # A healthy selected exit is sticky. Failover occurs only after the current
  # target's grace period and a replacement's continuous qualification window.
  failoverGraceSeconds: 300
  minReadySeconds: 120
  minHoldSeconds: 600
  resolverCidrs: {}

# Optional, provider-neutral network evidence. PublicEdge discovers the CRD by
# API group/resource and never configures the producing fabric implementation.
fabricEvidence:
  mode: Disabled # Disabled | Shadow | Optional | Required
  apiGroup: networking.re8ch.com
  apiVersion: v1alpha2
  resource: networkpathassessments
  # Match Advanced Fabric path eligibility by excluding Kubernetes NotReady nodes.
  requireDNSDependencies: false
  requireNodeReady: true
  allowedStates: [Ready, Partial]

publication:
  enabled: false
  # Named provider adapters may publish the same selected edge through
  # independent ExternalDNS-only Ingress objects. This includes PowerDNS via
  # an isolated ExternalDNS RFC2136 provider; credentials and provider
  # reconciliation remain outside Public Edge Manager.
  adapters: {}
  # Deprecated singleton retained for backwards compatibility.
  refs: {}

# Private, signed publication feed for independent RouterOS authorities.
# Bind only on a reviewed LAN node. The HMAC key Secret must be provisioned
# separately and mounted read-only; no credential belongs in Helm values.
bundlePublisher:
  enabled: false
  nodeName: ""
  bindAddress: ""
  port: 18553
  hmacSecretName: ""

rbac:
  mutateIngresses: false

service:
  type: ClusterIP
  annotations: {}
  externalTrafficPolicy: ""

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {cpu: 250m, memory: 128Mi}
