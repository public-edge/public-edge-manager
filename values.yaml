image:
  repository: ghcr.io/public-edge/public-edge-manager
  tag: "0.6.8"
  digest: ""
  pullPolicy: IfNotPresent

# Explicit opt-in prevents an unconfigured release from binding DNS port 53 on
# every cluster node.
enabled: false

crd:
  install: true

api:
  group: networking.re8ch.com

nameservers: []
services: {}
readinessGates: {}

discovery:
  enabled: true
  replicas: 2
  intervalSeconds: 15
  probeTimeoutSeconds: 2
  defaultCapacityMbps: 100
  # Nodes below this measured/configured uplink are never public exits or DNS authorities.
  minimumCapacityMbps: 100
  maxNameservers: 3
  gatewayNamespace: ""
  gatewaySelector: networking.re8ch.com/public-edge-gateway=true
  authorityLabel: networking.re8ch.com/public-edge-authority-ready
  ingressLabel: networking.re8ch.com/public-edge-ready
  serviceClasses: [api, web, registry, db-ro, db-rw]
  parentZone: ""
  childZones: []
  cloudflareSecretRef: {}

runtime:
  configMapName: public-edge-runtime

workload:
  hostNetwork: true
  dnsPort: 53
  httpPort: 8080
  priorityClassName: ""
  tolerations: []
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities: {add: [NET_BIND_SERVICE], drop: [ALL]}
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532

probe:
  connectTimeoutSeconds: 5
  responseTimeoutSeconds: 12
  intervalSeconds: 3
  # Bounds candidate/service TLS sampling so probes cannot starve health checks.
  maxWorkers: 8
  userAgent: public-edge-manager/0.4

dns:
  soaRname: hostmaster.invalid.
  # Optional ConfigMap with nameservers.json: {"nameservers":["ns1.example."]}.
  # A controller can update this without restarting the authority process.
  nameserversConfigMap: ""
  # Optional delegated zones. When set, apex NS/SOA and RFC-compatible negative
  # answers are served only for names inside these zones.
  zones: []
  # Static records delegated to a third-party CDN; never health-retargeted.
  externalRecords: {}

candidateSelection:
  capacityWeight: 10
  localAreaBonus: 100000
  priorityWeight: 1
  latencyDivisorMs: 20
  latencyPenaltyCap: 50
  localNodeBonus: 5
  # A healthy selected exit is sticky. Failover occurs only after the current
  # target's grace period and a replacement's continuous qualification window.
  failoverGraceSeconds: 300
  minReadySeconds: 120
  minHoldSeconds: 600
  resolverCidrs: {}

# Optional, provider-neutral network evidence. PublicEdge discovers the CRD by
# API group/resource and never configures the producing fabric implementation.
fabricEvidence:
  mode: Disabled # Disabled | Shadow | Optional | Required
  apiGroup: networking.re8ch.com
  apiVersion: v1alpha2
  resource: networkpathassessments
  # Match Advanced Fabric path eligibility by excluding Kubernetes NotReady nodes.
  requireNodeReady: true
  allowedStates: [Ready, Partial]

publication:
  enabled: false
  # Named provider adapters may publish the same selected edge through
  # independent ExternalDNS-only Ingress objects. This includes PowerDNS via
  # an isolated ExternalDNS RFC2136 provider; credentials and provider
  # reconciliation remain outside Public Edge Manager.
  adapters: {}
  # Deprecated singleton retained for backwards compatibility.
  refs: {}

rbac:
  mutateIngresses: false

service:
  type: ClusterIP
  annotations: {}
  externalTrafficPolicy: ""

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {cpu: 250m, memory: 128Mi}
